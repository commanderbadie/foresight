services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: foresight
      POSTGRES_PASSWORD: foresight
      POSTGRES_DB: foresight
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foresight"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://foresight:foresight@db:5432/foresight
      JWT_SECRET: ${JWT_SECRET:-change-me-please}
      CORS_ORIGINS: http://localhost:5173
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes: [./frontend:/app, /app/node_modules]
    environment:
      VITE_API_TARGET: http://backend:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on: [backend]
    ports: ["5173:5173"]

volumes:
  pgdata:
